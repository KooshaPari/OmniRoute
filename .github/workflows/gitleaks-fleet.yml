name: gitleaks-fleet
on:
  schedule: [{cron: '0 1 * * *'}]
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  security-events: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - name: Validate SARIF rule identities
        if: always()
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");

          const report = JSON.parse(readFileSync("results.sarif", "utf8"));
          if (!Array.isArray(report.runs)) {
            throw new Error("SARIF report has no runs array");
          }

          for (const [index, run] of report.runs.entries()) {
            const driver = run?.tool?.driver;
            if (!driver || !Array.isArray(driver.rules)) {
              throw new Error(
                `SARIF run ${index} has no tool.driver.rules array`
              );
            }

            const ruleIds = new Set();
            driver.rules = driver.rules.filter((rule) => {
              const invalidRule =
                !rule || typeof rule.id !== "string" || rule.id.length === 0;
              if (invalidRule) {
                throw new Error(
                  `SARIF run ${index} contains a rule without a non-empty id`
                );
              }
              if (ruleIds.has(rule.id)) return false;
              ruleIds.add(rule.id);
              return true;
            });

            for (const result of run.results || []) {
              const hasRuleId = typeof result.ruleId === "string";
              const danglingRule = hasRuleId && !ruleIds.has(result.ruleId);
              if (danglingRule) {
                throw new Error(
                  `SARIF run ${index} result references unknown ruleId ` +
                    result.ruleId
                );
              }
            }
          }

          const normalized = `${JSON.stringify(report, null, 2)}\n`;
          writeFileSync("results.sarif", normalized);
          NODE
      - name: Upload sarif
        if: always()
        # v4.37.1, pinned to its immutable commit.
        uses: github/codeql-action/upload-sarif@
          7188fc363630916deb702c7fdcf4e481b751f97a
        with:
          sarif_file: results.sarif
