# TypeScript typecheck lane: runs tsgo (TS7.1, Go-based, vendored) AND tsc (TS6.0.3)
# as parallel matrix jobs. tsgo provides 32-40x speedup once stable.
# Both must pass — the legacy tsc lane stays as the source-of-truth until tsgo
# reaches 100% on milestone-6 bugs (https://github.com/microsoft/typescript-go/milestone/6).
name: typescript
on: [push, pull_request]
jobs:
  tsgo:
    name: TS7 (tsgo, vendored)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - name: Build tsgo (microsoft/typescript-go main)
        run: |
          git clone --depth 1 --branch main https://github.com/microsoft/typescript-go.git vendor/typescript-go
          cd vendor/typescript-go && go build -o tsgo ./cmd/tsgo
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TS7 typecheck via vendored tsgo
        run: |
          ./vendor/typescript-go/tsgo -p tsconfig.typecheck-core.json --noEmit
      - name: Compare error counts vs tsc
        if: always()
        run: |
          echo "tsgo exit code: ${{ steps.tsgo.outcome }}"
          echo "(non-blocking — tsgo is at 64% on milestone-6, panics are expected)"

  tsc:
    name: TS6 (tsc, source-of-truth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TS6 typecheck (legacy source-of-truth)
        run: npx --no-install tsc -p tsconfig.typecheck-core.json --noEmit
