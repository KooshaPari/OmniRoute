# =============================================================================
# Trunk Check — Unified linting/formatting in GitHub Actions
# =============================================================================
# Handles: ruff, mypy, clippy, golangci-lint, prettier, eslint, shellcheck, etc.
# Free for open source; cached for fast runs
# =============================================================================

name: Trunk Check

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 3 * * 1'  # Weekly Monday 3am UTC

concurrency:
  group: trunk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trunk-check:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Trunk does not install custom-command binaries. Its setup action also
      # requires jq, while this repository's configuration invokes actionlint
      # and yamllint.
      - name: Install workflow lint dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes jq yamllint
          mkdir -p "$HOME/.local/bin"
          actionlint_version="1.7.12"
          actionlint_archive="actionlint_${actionlint_version}_linux_amd64.tar.gz"
          actionlint_url="https://github.com/rhysd/actionlint/releases/download"
          actionlint_url+="/v${actionlint_version}/${actionlint_archive}"
          curl --fail --silent --show-error --location "$actionlint_url" \
            --output "$RUNNER_TEMP/$actionlint_archive"
          expected_sha256="8aca8db96f1b94770f1b0d72b6dddcb1"
          expected_sha256+="ebb8123cb3712530b08cc387b349a3d8"
          printf '%s  %s\n' "$expected_sha256" \
            "$RUNNER_TEMP/$actionlint_archive" | sha256sum --check --status
          tar --extract --gzip --file "$RUNNER_TEMP/$actionlint_archive" \
            --directory "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          jq --version
          yamllint --version
          "$HOME/.local/bin/actionlint" --version

      - name: Trunk Check
        # Embeds actions/cache@27d5ce7f (v5.0.5).
        uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3

      - name: Trunk Upgrade (on schedule only)
        if: github.event_name == 'schedule'
        # Embeds actions/cache@27d5ce7f (v5.0.5).
        uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3
        with:
          trunk-args: --upgrade
