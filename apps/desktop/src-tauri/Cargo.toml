[package]
name = "omniroute-desktop"
version = "0.1.0"
description = "OmniRoute Tauri desktop shell"
authors = ["OmniRoute"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[workspace]
