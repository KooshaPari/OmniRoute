version: 0.1

cli:
  version: 1.22.2

plugins:
  sources:
    - id: trunk
      uri: https://github.com/trunk-io/plugins
      ref: v1.9.0
    - id: configs
      uri: https://github.com/trunk-io/configs
      ref: v1.2.1

# Keep the repository's existing Trunk quality surface explicit and bounded.
# Formatter-capable definitions (black, prettier, ruff, rustfmt) are enabled
# through the lint catalog; Trunk uses their formatter metadata for `trunk fmt`.
lint:
  enabled:
    - actionlint@1.7.12
    - black@26.3.1
    - clippy@1.71.1
    - golangci-lint2@2.11.4
    - mypy@1.20.2
    - prettier@3.8.3
    - ruff@0.15.12
    - rustfmt@1.68.2
    - shellcheck@0.11.0
    - taplo@0.10.0
    - yamllint@1.38.0
  disabled:
    # ESLint is owned by the dependency-aware TS/JS CI job (`npm run lint`).
    # Trunk's isolated linter runtime cannot resolve this repo's flat-config
    # imports (eslint-config-next and typescript-eslint) without project setup.
    - eslint
