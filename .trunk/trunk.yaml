# Trunk code-quality configuration.
# Schema: https://docs.trunk.io/reference/trunk-yaml
version: 0.1

cli:
  version: 1.22.2

plugins:
  sources:
    - id: trunk
      ref: v1.2.2
      uri: https://github.com/trunk-io/plugins

# Keep the repository's existing lint and format coverage. Trunk's current
# schema represents both linters and formatters in this single enabled list.
lint:
  enabled:
    - actionlint
    - black
    - clippy
    - eslint
    - golangci-lint
    - mypy
    - prettier
    - ruff
    - rustfmt
    - shellcheck
    - taplo
    - yamllint
  definitions:
    - name: actionlint
      commands:
        - name: actionlint
          run: actionlint ${target}
          success_codes: [0]
      direct_configs:
        - .github/workflows/*.yml
    - name: black
      commands:
        - name: black
          run: black --check --line-length 100 ${target}
          success_codes: [0]
      direct_configs:
        - pyproject.toml
        - ruff.toml
    - name: clippy
      commands:
        - name: clippy
          run: cargo clippy --all-targets --all-features -- -D warnings
          success_codes: [0]
    - name: mypy
      commands:
        - name: mypy
          run: mypy --ignore-missing-imports ${target}
          success_codes: [0]
    - name: ruff
      commands:
        - name: ruff
          run: ruff check --output-format=github ${target}
          success_codes: [0]
      direct_configs:
        - ruff.toml
        - pyproject.toml
    - name: rustfmt
      commands:
        - name: rustfmt
          run: rustfmt ${target}
          success_codes: [0]
      direct_configs:
        - rustfmt.toml

actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
