# .gitleaks.toml — gitleaks configuration for OmniRoute
# Task 7.18 — PLANO-QUALITY-GATES-FASE7.md
#
# Extends the default gitleaks rules with project-specific allowlists.
#
# INSTRUCTIONS for allowlists:
#   Legitimate findings (test fixtures, public OAuth creds already covered by
#   check-public-creds.mjs, example values in docs) must be registered below
#   in [[allowlist]] with a required explanatory comment.
#
#   DO NOT add an allowlist entry without justification. Each entry is reviewed
#   every release (stale-enforcement). Rule: if the finding is a real value the
#   system uses in production, it's a true positive — do not allowlist, fix it.
#
# Reference: docs/security/PUBLIC_CREDS.md (known public OAuth credentials)
#            CLAUDE.md Hard Rule #11 (resolvePublicCred required)

# Inherit ALL default gitleaks rules. WARNING: a custom config WITHOUT
# [extend].useDefault = true (and without its own [[rules]]) results in ZERO
# rules — gitleaks REPLACES the default ruleset with the file, it does not
# extend it. Without this section, `gitleaks --config .gitleaks.toml` never
# detects anything (every finding becomes 0), making the gate inert. With
# useDefault, the allowlist below is applied ON TOP of the ~170 default rules.
[extend]
  useDefault = true

# Para desabilitar uma regra específica, usar:
# [[rules]]
#   id = "rule-id"
#   [rules.allowlist]
#     description = "..."

# ---------------------------------------------------------------------------
# Project-level global allowlist
# Entries here are ignored in ALL scans.
# ---------------------------------------------------------------------------
[allowlist]
  description = "OmniRoute project-level allowlist — fixtures, test vectors, public OAuth creds"

  # Paths to ignore completely (node_modules, builds, etc.)
  paths = [
    '''node_modules''',
    '''\.next''',
    '''dist''',
    '''\.git''',
    '''coverage''',
    '''\.nyc_output''',
  ]

  # Specific commits to ignore (e.g. commit that introduced test fixtures)
  # commits = []

  # Stopword regexes — lines that contain these patterns are ignored.
  # Use only for proven false positives with justification below.
  # stopwords = []

  # Target regexes (file paths) that may be allowlisted per rule.
  # See per-rule [[allowlist]] below for granularity.

# ---------------------------------------------------------------------------
# Per-rule allowlist (add as needed during stale review)
# ---------------------------------------------------------------------------
#
# Example (REMOVE / REPLACE with real entries when needed):
#
# [[rules]]
#   # Allowlist test fixtures that contain example/invalid OAuth tokens
#   # Added: 2026-06-13 | Review in: v3.9.0 | Justification: non-real test values
#   id = "github-fine-grained-pat"
#   [rules.allowlist]
#     description = "Test fixture PATs — synthetic, non-functional values"
#     paths = [
#       '''tests/fixtures/''',
#       '''tests/unit/''',
#     ]

[[rules]]
  # Proven generic-api-key false positives — cleared on 2026-07-13 (WS6/D3,
  # v3.8.49 plan). Review in v3.9.0. None are credentials: two are FIELD NAMES
  # for latency metrics; the third is the PUBLIC value of an Anthropic API beta
  # header (publicly documented, not a secret).
  id = "generic-api-key"
  [rules.allowlist]
    description = "Historical false positives for field names and public values (not secrets)"
    commits = ["67da48642e0df089de1d5f9834ec34fe015ae020"]
    paths = [
      '''tests/unit/model-latency-stats-route.test.ts''',
      '''bin/cli/commands/usage.mjs''',
    ]
    regexes = [
      '''latencyP\d{2}Ms''',
      '''interleaved-thinking-2025-05-14''',
      # v3.8.49 pre-flight (2026-07-28). Neither is a credential:
      # - localStorage key for the sponsorship banner (#8723), just a UI identifier;
      # - PUBLIC x-api-key for Firefly web (documented in open-sse/utils/publicCreds.ts:207);
      #   both flagged occurrences are in JSDoc comments; the runtime reads from resolvePublicCred().
      '''omniroute-kimi-sponsor-banner-dismissed-v1''',
      '''SunbreakWebUI1''',
    ]
