# Mergify Configuration - Optimized for polyrepo monorepos
# Docs: https://docs.mergify.com/

pull_request_rules:
  # Auto-merge when all CI checks pass and PR is approved
  - name: Auto-merge when approved + CI green
    conditions:
      - "#review-requested=0"
      - "#approved-reviews-by>=1"
      - check-success=ci
      - check-success=lint
      - check-success=test
      - -conflict
      - -closed
    actions:
      merge:
        method: squash
        commit_message_template: |
          {{ title }} (#{{ number }})
          
          Co-authored-by: {{ author }}

  # Label PRs based on changed files
  - name: Label Python changes
    conditions:
      - files~=\.py$
    actions:
      label:
        add:
          - python

  - name: Label Rust changes
    conditions:
      - files~=\.rs$|Cargo\.
    actions:
      label:
        add:
          - rust

  - name: Label TypeScript changes
    conditions:
      - files~=\.ts$|\.tsx$|package\.json
    actions:
      label:
        add:
          - typescript

  # Warn on large PRs
  - name: Warn on large PRs
    conditions:
      - -closed
      - -draft
      - "#files>20"
    actions:
      comment:
        message: >
          **Large PR Alert**: This PR touches {{ number }} files.
          Consider splitting into smaller PRs for easier review.

  # Add ready-to-merge label when all checks pass
  - name: Add ready-to-merge label
    conditions:
      - -closed
      - -draft
      - check-success=ci
      - check-success=lint
      - check-success=test
      - "#approved-reviews-by>=1"
    actions:
      label:
        add:
          - ready-to-merge
